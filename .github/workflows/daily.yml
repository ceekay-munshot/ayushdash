name: daily

# Daily live update (off-peak). All scripts are idempotent/incremental:
# new episodes get fetched + extracted, performance for ALL rows is refreshed
# so in-progress windows mature, then the scorecard is rebuilt and committed.

on:
  schedule:
    - cron: '17 13 * * *' # 13:17 UTC daily
  workflow_dispatch:

concurrency:
  group: investtalk-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch episodes
        run: node scripts/fetch-episodes.mjs

      - name: Fetch transcripts
        run: node scripts/fetch-transcripts.mjs

      - name: Extract names (new episodes only)
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ secrets.BEDROCK_MODEL_IDS }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: node scripts/extract-names.mjs --commit-every 20

      # Safety net: persist paid extractions even if a later step fails.
      - name: Commit extractions
        if: always()
        run: bash .github/scripts/commit-data.sh "extract" public/data/names.json public/data/summaries.json

      - name: Enrich performance (refresh all)
        run: node scripts/enrich-performance.mjs

      - name: Build scorecard
        run: node scripts/build-scorecard.mjs

      - name: Commit data
        run: bash .github/scripts/commit-data.sh "daily"
